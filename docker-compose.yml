# Entorno de desarrollo local. Ver docs/desarrollo-local.md
#
#   docker compose up --build --watch     → todo el stack con recarga en caliente
#   docker compose down                   → detener (los datos se conservan)
#   docker compose down -v                → detener y BORRAR la base de datos y los archivos
#
# MinIO reemplaza a Cloudflare R2 en desarrollo (misma API de S3): la API nunca guarda archivos en disco.
name: viaticos

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos
      POSTGRES_DB: gastos
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: viaticos
      MINIO_ROOT_PASSWORD: viaticos-local
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Crea el bucket privado de los soportes (idempotente).
  minio-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: >-
      sh -c "mc alias set local http://minio:9000 viaticos viaticos-local &&
             mc mb --ignore-existing local/soportes"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api:
    build: ./apps/api
    image: viaticos-api:dev
    # Migraciones + datos de desarrollo (idempotente) + recarga en caliente.
    entrypoint: >-
      sh -c "alembic upgrade head && python -m scripts.seed_dev &&
             exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://gastos:gastos@db:5432/gastos
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-desarrollo-local-no-usar-en-produccion-0123456789}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-x6rXhbMybM3IU7DmO7c2gE6PS-VzlI7nKeRuTzvYsBo=}
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-superadmin}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
      R2_ENDPOINT_URL: http://minio:9000
      R2_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT:-9000}
      R2_BUCKET: soportes
      R2_ACCESS_KEY_ID: viaticos
      R2_SECRET_ACCESS_KEY: viaticos-local
      R2_REGION: us-east-1
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    # Sin puerto publicado a propósito: se usa a través de la web en http://localhost:5173/api/v1.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    develop:
      watch:
        - { action: sync, path: ./apps/api/app, target: /app/app }
        - { action: sync, path: ./apps/api/prompts, target: /app/prompts }
        - { action: rebuild, path: ./apps/api/alembic }
        - { action: rebuild, path: ./apps/api/requirements.txt }

  web:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: viaticos-web:dev
    command: pnpm --filter @viaticos/web exec vite --host 0.0.0.0 --port 5173
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    develop:
      watch:
        - { action: sync, path: ./apps/web/src, target: /app/apps/web/src }
        - { action: sync, path: ./apps/web/public, target: /app/apps/web/public }
        - { action: sync, path: ./packages, target: /app/packages }
        - { action: rebuild, path: ./pnpm-lock.yaml }

  # Explorador web de la base de datos: docker compose --profile herramientas up -d adminer
  adminer:
    image: adminer:5
    profiles: [herramientas]
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on: [db]

volumes:
  db-data:
  minio-data:
