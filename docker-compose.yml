# Entorno de desarrollo local. Ver docs/desarrollo-local.md
#
#   docker compose up --build --watch     → todo el stack con recarga en caliente
#   docker compose down                   → detener (los datos se conservan)
#   docker compose down -v                → detener y BORRAR la base de datos y los archivos
#
# SeaweedFS reemplaza a Cloudflare R2 en desarrollo (misma API de S3): la API nunca guarda archivos en disco.
name: viaticos

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos
      POSTGRES_DB: gastos
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Almacenamiento compatible con S3 en lugar de Cloudflare R2 (MinIO ya no publica imágenes).
  s3:
    image: chrislusf/seaweedfs:4.48
    entrypoint: >-
      sh -c "weed server -dir=/data -ip=s3 -s3 -s3.port=9000 -s3.config=/etc/s3.json -master.volumeSizeLimitMB=64 &
             until echo 's3.bucket.create -name soportes' | weed shell -master=s3:9333 | grep -qE 'created|exist'; do sleep 2; done;
             touch /tmp/listo; wait"
    restart: unless-stopped
    configs:
      - source: credenciales-s3
        target: /etc/s3.json
    ports:
      - "${S3_PORT:-9000}:9000"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/listo"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: ./apps/api
    image: viaticos-api:dev
    # Migraciones + datos de desarrollo (idempotente) + recarga en caliente.
    entrypoint: >-
      sh -c "alembic upgrade head && python -m scripts.seed_dev &&
             exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://gastos:gastos@db:5432/gastos
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-desarrollo-local-no-usar-en-produccion-0123456789}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-x6rXhbMybM3IU7DmO7c2gE6PS-VzlI7nKeRuTzvYsBo=}
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-superadmin}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
      R2_ENDPOINT_URL: http://s3:9000
      R2_PUBLIC_ENDPOINT_URL: http://localhost:${S3_PORT:-9000}
      R2_BUCKET: soportes
      R2_ACCESS_KEY_ID: viaticos
      R2_SECRET_ACCESS_KEY: viaticos-local
      R2_REGION: us-east-1
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    # Sin puerto publicado a propósito: se usa a través de la web en http://localhost:5173/api/v1.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    develop:
      watch:
        - { action: sync, path: ./apps/api/app, target: /app/app }
        - { action: sync, path: ./apps/api/prompts, target: /app/prompts }
        - { action: rebuild, path: ./apps/api/alembic }
        - { action: rebuild, path: ./apps/api/requirements.txt }

  web:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: viaticos-web:dev
    command: pnpm --filter @viaticos/web exec vite --host 0.0.0.0 --port 5173
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    develop:
      watch:
        - { action: sync, path: ./apps/web/src, target: /app/apps/web/src }
        - { action: sync, path: ./apps/web/public, target: /app/apps/web/public }
        - { action: sync, path: ./packages, target: /app/packages }
        - { action: rebuild, path: ./pnpm-lock.yaml }

  # Explorador web de la base de datos: docker compose --profile herramientas up -d adminer
  adminer:
    image: adminer:5
    profiles: [herramientas]
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on: [db]

configs:
  credenciales-s3:
    content: |
      {"identities": [{"name": "viaticos", "credentials": [{"accessKey": "viaticos", "secretKey": "viaticos-local"}],
                       "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}

volumes:
  db-data:
  s3-data:
