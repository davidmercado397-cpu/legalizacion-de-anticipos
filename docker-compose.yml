# Entorno de desarrollo local.
#   docker compose up -d db          → solo PostgreSQL (para correr API/web con pnpm)
#   docker compose watch             → todo el stack con recarga en caliente
# Ver docs/desarrollo-local.md
name: viaticos

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-viaticos}
      POSTGRES_USER: ${POSTGRES_USER:-viaticos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viaticos_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
