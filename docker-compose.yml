# Entorno de desarrollo local. Ver docs/desarrollo-local.md
#
#   docker compose up --build --watch     → todo el stack con recarga en caliente
#   docker compose up -d db               → solo PostgreSQL (para correr API/web con pnpm en su equipo)
#   docker compose down                   → detener (los datos se conservan)
#   docker compose down -v                → detener y BORRAR la base de datos
name: viaticos

x-app: &app
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  image: viaticos-dev:local
  environment: &entorno-api
    NODE_ENV: development
    PERSISTENCIA: postgres
    DATABASE_URL: postgres://${POSTGRES_USER:-viaticos}:${POSTGRES_PASSWORD:-viaticos_local}@db:5432/${POSTGRES_DB:-viaticos}
    AUTH_MODE: ${AUTH_MODE:-jwt}
    JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env (copie .env.example)}
    TASAS_PROVEEDOR: ${TASAS_PROVEEDOR:-oficial}
    TRM_DESARROLLO: ${TRM_DESARROLLO:-4000}
    CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
    OCR_PROVEEDOR: ${OCR_PROVEEDOR:-manual}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OCR_ESFUERZO: ${OCR_ESFUERZO:-medium}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-viaticos}
      POSTGRES_USER: ${POSTGRES_USER:-viaticos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viaticos_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Aplica migraciones y carga datos de desarrollo (idempotente) antes de arrancar la API.
  migraciones:
    <<: *app
    command: sh -c "pnpm --filter @viaticos/api exec tsx src/database/cli.ts migrar && pnpm --filter @viaticos/api exec tsx src/database/cli.ts sembrar"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: pnpm --filter @viaticos/api exec tsx watch src/main.ts
    environment:
      <<: *entorno-api
      PORT: 3000
      ALMACEN_DIR: /app/almacen
    volumes:
      - almacen-data:/app/almacen
    # Sin puerto publicado a propósito: la API se usa a través de la web en
    # http://localhost:5173/api/v1 (mismo origen) y así no choca con otros proyectos
    # que usen el puerto 3000 en su equipo.
    depends_on:
      migraciones:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/salud || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    develop:
      watch:
        - { action: sync, path: ./apps/api/src, target: /app/apps/api/src }
        - { action: sync, path: ./packages/shared-kernel/src, target: /app/packages/shared-kernel/src }
        - { action: sync, path: ./packages/contracts/src, target: /app/packages/contracts/src }
        - { action: rebuild, path: ./pnpm-lock.yaml }
        - { action: rebuild, path: ./apps/api/drizzle }

  web:
    <<: *app
    command: pnpm --filter @viaticos/web exec vite --host 0.0.0.0 --port 5173
    environment:
      VITE_API_PROXY: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    # Sano solo si la web responde Y alcanza la API a través del proxy (detecta problemas de red entre contenedores).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/api/v1/salud || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    develop:
      watch:
        - { action: sync, path: ./apps/web/src, target: /app/apps/web/src }
        - { action: sync, path: ./apps/web/public, target: /app/apps/web/public }
        - { action: sync, path: ./packages/contracts/src, target: /app/packages/contracts/src }
        - { action: sync, path: ./packages/client-api/src, target: /app/packages/client-api/src }
        - { action: sync, path: ./packages/client-app/src, target: /app/packages/client-app/src }
        - { action: rebuild, path: ./pnpm-lock.yaml }

  # Explorador web de la base de datos: docker compose --profile herramientas up -d adminer
  adminer:
    image: adminer:5
    profiles: [herramientas]
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on: [db]

volumes:
  db-data:
  # Fotos y PDF de las facturas
  almacen-data:
