name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gastos
          POSTGRES_PASSWORD: gastos
          POSTGRES_DB: gastos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gastos" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://gastos:gastos@localhost:5432/gastos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Hexagonal architecture
        run: lint-imports
      - name: Dead code and unused dependencies
        run: vulture && deptry .
      - name: Tests with coverage (minimum 85%)
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml
      - name: Migrations apply cleanly on an empty database and match the models
        env:
          PGPASSWORD: gastos
          DATABASE_URL: postgresql+asyncpg://gastos:gastos@localhost:5432/gastos_migrations
        run: |
          psql -h localhost -U gastos -d gastos_test -c "CREATE DATABASE gastos_migrations"
          alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check

  security:
    name: API security evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gastos
          POSTGRES_PASSWORD: gastos
          POSTGRES_DB: gastos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gastos" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://gastos:gastos@localhost:5432/gastos_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks revisa todo el historial
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Secrets in the git history (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Security evidence (pip-audit, bandit, architecture, tests, SBOM)
        run: ./scripts/security_evidence.sh security-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: apps/api/security-evidence

  web:
    name: Web (typecheck, pruebas y build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Imagen de la API
        run: docker build -t viaticos-api apps/api
      - name: Imagen de producción de la web
        run: docker build -f apps/web/Dockerfile -t viaticos-web .
