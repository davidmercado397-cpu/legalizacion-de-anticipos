# Producción en Coolify (recurso «Docker Compose», archivo docker-compose.prod.yml). Ver docs/despliegue-coolify.md
#
# Solo la web se publica: en Coolify se le asigna el dominio apuntando al puerto 8080. La API, la base y Redis
# quedan en la red interna; nginx reenvía /api y /webhooks a la API. Los archivos van a Cloudflare R2.
# Las variables con «:?» son las únicas obligatorias (POSTGRES_PASSWORD, JWT_SECRET, MFA_ENCRYPTION_KEY); Coolify
# las muestra en Environment Variables para llenarlas.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8000
      FILES_ORIGIN: ${FILES_ORIGIN:-https://*.r2.cloudflarestorage.com}
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      APP_ENV: production
      ENABLE_DOCS: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # La web y la API comparten dominio (nginx), así que CORS solo hace falta si otro origen llama a la API.
      CORS_ORIGINS: ${APP_URL:-}
      DATABASE_URL: postgresql+asyncpg://gastos:${POSTGRES_PASSWORD:?}@db:5432/gastos
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      JWT_SECRET: ${JWT_SECRET:?}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?}
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-}
      # Sin R2 la app arranca, pero subir facturas responde que el almacenamiento no está configurado.
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: gastos
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
