# Prueba LOCAL de las imágenes de producción (no es la configuración de un servidor real).
#   docker compose -f docker-compose.prod.yml up --build -d     → http://localhost:8080
name: viaticos-prod

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: viaticos
      POSTGRES_USER: viaticos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viaticos_local}
    volumes:
      - db-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viaticos -d viaticos"]
      interval: 5s
      retries: 20

  migraciones:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: viaticos-api:local
    environment:
      DATABASE_URL: postgres://viaticos:${POSTGRES_PASSWORD:-viaticos_local}@db:5432/viaticos
    # Solo en esta prueba local se cargan los usuarios de desarrollo (la semilla se niega en producción).
    command: sh -c "node dist/cli.js migrar && NODE_ENV=development node dist/cli.js sembrar"
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: viaticos-api:local
    environment:
      NODE_ENV: production
      PERSISTENCIA: postgres
      DATABASE_URL: postgres://viaticos:${POSTGRES_PASSWORD:-viaticos_local}@db:5432/viaticos
      AUTH_MODE: jwt
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      CORS_ORIGINS: http://localhost:8080
      OCR_PROVEEDOR: ${OCR_PROVEEDOR:-manual}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - almacen-prod:/app/almacen
    depends_on:
      migraciones: { condition: service_completed_successfully }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: viaticos-web:local
    ports:
      - "8080:8080"
    depends_on:
      api: { condition: service_healthy }

volumes:
  db-prod:
  almacen-prod:
